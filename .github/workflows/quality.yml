name: FilmDeck Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate extension and run regression tests
        env:
          CI_CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check

  browser:
    name: Browser smoke (${{ matrix.engine }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, chromium]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test installed extension with local synthetic media
        run: npm run test:browser -- --engine=${{ matrix.engine }} --narrow=true
      - name: Test iframe audio selection and fullscreen HUD state
        run: node tests/hud-state-browser.cjs --engine=${{ matrix.engine }}
      - name: Test HUD place, page transitions and single visible panel
        run: node tests/hud-continuity-browser.cjs --engine=${{ matrix.engine }} --headless=true
      - name: Test dialog keyboard behaviour
        run: node tests/dialog-keyboard-browser.cjs --engine=${{ matrix.engine }}
      - name: Test panel volume against the real media level
        run: node tests/volume-mirror-browser.cjs --engine=${{ matrix.engine }}
      - name: Test CDN measurement outcomes and their explanations
        run: node tests/cdn-measure-browser.cjs --engine=${{ matrix.engine }}
      - name: Test native PiP and iframe user activation
        run: node tests/pip-browser.cjs --engine=${{ matrix.engine }}
      - name: Test real toolbar startup with strict Trusted Types
        run: node tests/startup-browser.cjs --engine=${{ matrix.engine }}
      - name: Test report window privacy and rendering
        run: node tests/report-browser.cjs --engine=${{ matrix.engine }} --headless=true

  # Separate from the required smoke job: it depends on the runner's H.264 support and a pinned download.
  media:
    name: Browser media (${{ matrix.engine }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, chromium]
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download checksum-pinned player runtimes
        run: node tests/prepare-browser-fixtures.cjs --runtimes-only --download-runtimes
      - name: Test quality labels against real Video.js playback
        run: node tests/quality-mapping-browser.cjs --engine=${{ matrix.engine }}
      - name: Test a real Hls.js player attached before the engine loads
        run: node tests/hls-early-attach-browser.cjs --engine=${{ matrix.engine }}

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm audit --package-lock-only --omit=dev --audit-level=moderate
      - run: npm audit --package-lock-only --audit-level=high

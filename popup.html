<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>NOk Video Controller</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .badge {
      background: #2563eb;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 4px;
    }
    .btn-launch {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:8px;">
    <span class="badge">NOkrep v0.4.8</span>
    <strong>NOk Video Controller</strong>
  </div>
  <p style="font-size:12px;color:#94a3b8;margin-top:8px;">
    Video kontrol çubuğuna <strong>[PVC]</strong> butonu ekler. Tam ekranda da kontrol edilebilir.
  </p>
  <button id="launchBtn" class="btn-launch">⚡ Kontrol Çubuğuna Entegre Et</button>
  <script src="popup.js"></script>
</body>
</html>
